# Builds NCS-Workbench.exe on every push and pull request; a vX.Y.Z tag also
# publishes a GitHub release with the exe attached.
#
# Release: git tag v1.0.0 && git push origin v1.0.0

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # msvcrt variant: UCRT builds don't run on XP. Bump all three together.
  LLVM_MINGW: llvm-mingw-20261006-msvcrt-x86_64
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-msvcrt-x86_64.zip
  LLVM_MINGW_SHA256: 24847b37a951c8583c3f7ec061de2eb87f6394215c8ef3fdc4565ed0835396e1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\llvm-mingw
          key: ${{ env.LLVM_MINGW }}

      - name: Download toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest $env:LLVM_MINGW_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LLVM_MINGW_SHA256) { throw "Toolchain checksum mismatch: $hash" }
          Expand-Archive $zip $env:RUNNER_TEMP
          Rename-Item (Join-Path $env:RUNNER_TEMP $env:LLVM_MINGW) 'llvm-mingw'

      - name: Add toolchain to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP 'llvm-mingw\bin')

      # Tags vX.Y.Z stamp X.Y.Z; other builds say dev-<commit>.
      - name: Stamp version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          $major = 0; $minor = 0; $patch = 0; $text = "dev-$($env:SHA.Substring(0, 7))"
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw "Release tags must look like v1.2.3, got $env:REF_NAME" }
            $major = $Matches[1]; $minor = $Matches[2]; $patch = $Matches[3]; $text = "$major.$minor.$patch"
          }
          Set-Content src\version.h -Encoding ascii -Value @(
            '// Generated by .github/workflows/build.yml.',
            '#pragma once',
            "#define APP_VERSION_MAJOR $major",
            "#define APP_VERSION_MINOR $minor",
            "#define APP_VERSION_PATCH $patch",
            "#define APP_VERSION_STRING `"$text`"")
          "VERSION=$text" | Add-Content $env:GITHUB_ENV

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Test
        shell: cmd
        run: test.cmd

      # The zip carries the GPL and font licences (OFL) next to the exe.
      - name: Package
        shell: pwsh
        run: |
          $dir = "build\NCS-Workbench-$env:VERSION"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item build\NCS-Workbench.exe, LICENSE, fonts\*-OFL.txt $dir
          Compress-Archive "$dir\*" "build\NCS-Workbench-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NCS-Workbench
          path: |
            build/NCS-Workbench.exe
            build/NCS-Workbench-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NCS-Workbench

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum NCS-Workbench.exe NCS-Workbench-*.zip > SHA256SUMS.txt
          gh release create "$TAG" NCS-Workbench.exe NCS-Workbench-*.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "NCS Workbench $TAG" --generate-notes
