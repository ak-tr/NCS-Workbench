# Builds NCS-Workbench.exe on every push and pull request; a release also
# publishes a GitHub release with the exe attached.
#
# Release: Actions > Build > Run workflow on main, pick patch/minor/major
# (or: gh workflow run build.yml -f release=patch). The next version comes
# from the newest vX.Y.Z tag; the release creates the tag. Pushing a tag
# (git tag v1.0.0 && git push origin v1.0.0) still works too.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release, bumping the newest vX.Y.Z tag
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: read

env:
  # msvcrt variant: UCRT builds don't run on XP. Bump all three together.
  LLVM_MINGW: llvm-mingw-20261006-msvcrt-x86_64
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-msvcrt-x86_64.zip
  LLVM_MINGW_SHA256: 24847b37a951c8583c3f7ec061de2eb87f6394215c8ef3fdc4565ed0835396e1

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}  # set when this run makes a release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags, to find the newest version

      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\llvm-mingw
          key: ${{ env.LLVM_MINGW }}

      - name: Download toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest $env:LLVM_MINGW_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LLVM_MINGW_SHA256) { throw "Toolchain checksum mismatch: $hash" }
          Expand-Archive $zip $env:RUNNER_TEMP
          Rename-Item (Join-Path $env:RUNNER_TEMP $env:LLVM_MINGW) 'llvm-mingw'

      - name: Add toolchain to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP 'llvm-mingw\bin')

      # Releases (a pushed tag vX.Y.Z, or a run with release = patch/minor/major)
      # stamp X.Y.Z; other builds say dev-<commit>.
      - name: Stamp version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RELEASE: ${{ inputs.release }}
        run: |
          $major = 0; $minor = 0; $patch = 0; $text = "dev-$($env:SHA.Substring(0, 7))"
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw "Release tags must look like v1.2.3, got $env:REF_NAME" }
            $major = [int]$Matches[1]; $minor = [int]$Matches[2]; $patch = [int]$Matches[3]; $text = "$major.$minor.$patch"
            "tag=$env:REF_NAME" | Add-Content $env:GITHUB_OUTPUT
          } elseif ($env:RELEASE -and $env:RELEASE -ne 'none') {
            if ($env:REF_NAME -ne 'main') { throw "Releases are made from main, not $env:REF_NAME" }
            $newest = git tag --list 'v*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]$_.Substring(1) } | Sort-Object | Select-Object -Last 1
            if ($newest) { $major = $newest.Major; $minor = $newest.Minor; $patch = $newest.Build }
            switch ($env:RELEASE) {
              'major' { $major++; $minor = 0; $patch = 0 }
              'minor' { $minor++; $patch = 0 }
              'patch' { $patch++ }
            }
            $text = "$major.$minor.$patch"
            "tag=v$text" | Add-Content $env:GITHUB_OUTPUT
          }
          Set-Content src\version.h -Encoding ascii -Value @(
            '// Generated by .github/workflows/build.yml.',
            '#pragma once',
            "#define APP_VERSION_MAJOR $major",
            "#define APP_VERSION_MINOR $minor",
            "#define APP_VERSION_PATCH $patch",
            "#define APP_VERSION_STRING `"$text`"")
          "VERSION=$text" | Add-Content $env:GITHUB_ENV

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Test
        shell: cmd
        run: test.cmd

      # The zip carries the GPL and font licences (OFL) next to the exe.
      - name: Package
        shell: pwsh
        run: |
          $dir = "build\NCS-Workbench-$env:VERSION"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item build\NCS-Workbench.exe, LICENSE, fonts\*-OFL.txt $dir
          Compress-Archive "$dir\*" "build\NCS-Workbench-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NCS-Workbench
          path: |
            build/NCS-Workbench.exe
            build/NCS-Workbench-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NCS-Workbench

      # --target creates the tag on the built commit when the run made the version.
      # A tag made with this token starts no new workflow run.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          sha256sum NCS-Workbench.exe NCS-Workbench-*.zip > SHA256SUMS.txt
          gh release create "$TAG" NCS-Workbench.exe NCS-Workbench-*.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "NCS Workbench $TAG" --generate-notes
